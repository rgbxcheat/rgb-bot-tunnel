<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Your Code - RGB BOT V1</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* =========================================================
   CLEAN GET KEY PAGE
   ========================================================= */

.getkey-page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
}

.getkey-card {
    width: min(440px, 100%);
    text-align: center;
    padding: 42px 28px 34px;
    box-sizing: border-box;
    position: relative;
}

/* Small decorative flower */
.flower {
    width: 44px;
    height: 44px;
    margin: 0 auto 24px;
    position: relative;
}

.flower::before,
.flower::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-radius: 50%;
}

.flower::before {
    transform: rotate(45deg);
}

.flower::after {
    transform: rotate(-45deg);
}

.flower-center {
    position: absolute;
    width: 9px;
    height: 9px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.getkey-label {
    font-size: 11px;
    letter-spacing: 3px;
    opacity: 0.55;
    margin-bottom: 12px;
}

.getkey-title {
    margin: 0;
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: 700;
}

.getkey-message {
    margin: 14px 0 26px;
    min-height: 20px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.62;
}

.getkey-code {
    width: 100%;
    box-sizing: border-box;
    padding: 20px 12px;
    margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 12px;
    background: rgba(0,0,0,0.22);
    font-size: clamp(21px, 6vw, 28px);
    font-weight: 700;
    letter-spacing: 3px;
    word-break: break-all;
}

.getkey-timer-label {
    font-size: 9px;
    letter-spacing: 3px;
    opacity: 0.48;
    margin-bottom: 5px;
}

.getkey-timer {
    font-size: 22px;
    letter-spacing: 4px;
    font-weight: 600;
    margin-bottom: 24px;
}

.getkey-timer.expired {
    opacity: 0.45;
}

.getkey-copy {
    width: 100%;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 10px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.06);
    color: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: 0.2s ease;
}

.getkey-copy:hover:not(:disabled) {
    background: rgba(255,255,255,0.12);
}

.getkey-copy:active:not(:disabled) {
    transform: scale(0.98);
}

.getkey-copy:disabled {
    opacity: 0.3;
    cursor: default;
}

.getkey-status {
    height: 18px;
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.55;
}

.getkey-footer {
    margin-top: 24px;
    font-size: 9px;
    letter-spacing: 2px;
    opacity: 0.3;
}

.getkey-error {
    opacity: 0.55;
}

@media (max-width: 420px) {
    .getkey-page {
        padding: 16px;
    }

    .getkey-card {
        padding: 34px 20px 28px;
    }

    .getkey-title {
        font-size: 23px;
    }

    .getkey-code {
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<main class="getkey-page">

    <section class="getkey-card">

        <div class="flower" aria-hidden="true">
            <div class="flower-center"></div>
        </div>

        <div class="getkey-label">
            RGB BOT V1
        </div>

        <h1 class="getkey-title">
            YOUR ACCESS CODE
        </h1>

        <p id="message" class="getkey-message">
            CONNECTING TO SERVER...
        </p>

        <div id="keyBox" class="getkey-code">
            —
        </div>

        <div class="getkey-timer-label">
            TIME REMAINING
        </div>

        <div id="countdown" class="getkey-timer">
            --:--:--
        </div>

        <button
            id="copyButton"
            class="getkey-copy"
            type="button"
            disabled
        >
            COPY CODE
        </button>

        <div id="copyStatus" class="getkey-status"></div>

        <div class="getkey-footer">
            CODE VALID FOR 24 HOURS
        </div>

    </section>

</main>


<script>
"use strict";

/*
 * The website never creates keys itself.
 * It asks the RGB BOT V1 server for a new key.
 */

const REGISTRY_URL = "current_tunnel.json";

let API_BASE = "";
let generatedKey = "";
let expiresAt = null;
let countdownTimer = null;

const message =
    document.getElementById("message");

const keyBox =
    document.getElementById("keyBox");

const countdown =
    document.getElementById("countdown");

const copyButton =
    document.getElementById("copyButton");

const copyStatus =
    document.getElementById("copyStatus");


function stopCountdown() {

    if (countdownTimer !== null) {
        clearInterval(countdownTimer);
        countdownTimer = null;
    }
}


function setMessage(text, error = false) {

    message.textContent = text;

    message.classList.toggle(
        "getkey-error",
        error
    );
}


async function loadServerUrl() {

    const response = await fetch(
        REGISTRY_URL + "?ts=" + Date.now(),
        {
            method: "GET",
            cache: "no-store"
        }
    );

    if (!response.ok) {
        throw new Error(
            "REGISTRY_HTTP_" + response.status
        );
    }

    const config = await response.json();

    if (
        !config ||
        typeof config.base_url !== "string" ||
        !config.base_url.trim()
    ) {
        throw new Error("NO_SERVER_URL");
    }

    API_BASE =
        config.base_url
            .trim()
            .replace(/\/+$/, "");

    if (
        !API_BASE.startsWith("https://") &&
        !API_BASE.startsWith("http://")
    ) {
        throw new Error("INVALID_SERVER_URL");
    }
}


async function generateKey() {

    stopCountdown();

    generatedKey = "";
    expiresAt = null;

    keyBox.textContent = "—";
    countdown.textContent = "--:--:--";
    countdown.classList.remove("expired");

    copyButton.disabled = true;
    copyStatus.textContent = "";

    try {

        setMessage(
            "CONNECTING TO SERVER..."
        );

        await loadServerUrl();

        setMessage(
            "GENERATING YOUR CODE..."
        );

        const response = await fetch(
            API_BASE + "/api/get-key",
            {
                method: "POST",
                mode: "cors",
                cache: "no-store",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: "{}"
            }
        );

        let data;

        try {
            data = await response.json();
        } catch (_) {
            throw new Error(
                "INVALID_SERVER_RESPONSE"
            );
        }

        if (
            !response.ok ||
            !data ||
            data.success !== true ||
            typeof data.key !== "string" ||
            !data.key ||
            typeof data.expires_at !== "string" ||
            !data.expires_at
        ) {
            console.error(
                "GET KEY RESPONSE:",
                data
            );

            throw new Error(
                data && data.error
                    ? data.error
                    : "KEY_GENERATION_FAILED"
            );
        }

        generatedKey =
            data.key.trim();

        expiresAt =
            new Date(data.expires_at);

        if (
            Number.isNaN(
                expiresAt.getTime()
            )
        ) {
            throw new Error(
                "INVALID_EXPIRY"
            );
        }

        keyBox.textContent =
            generatedKey;

        setMessage(
            "CODE READY"
        );

        copyButton.disabled = false;

        updateCountdown();

        countdownTimer =
            setInterval(
                updateCountdown,
                1000
            );

    } catch (error) {

        console.error(
            "RGB BOT V1 GET KEY ERROR:",
            error
        );

        keyBox.textContent =
            "UNAVAILABLE";

        countdown.textContent =
            "--:--:--";

        copyButton.disabled = true;

        setMessage(
            "SERVER CONNECTION FAILED",
            true
        );
    }
}


function updateCountdown() {

    if (!expiresAt) {
        countdown.textContent =
            "--:--:--";
        return;
    }

    const remaining =
        expiresAt.getTime() - Date.now();

    if (remaining <= 0) {

        countdown.textContent =
            "EXPIRED";

        countdown.classList.add(
            "expired"
        );

        stopCountdown();

        return;
    }

    const totalSeconds =
        Math.floor(
            remaining / 1000
        );

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );

    const seconds =
        totalSeconds % 60;

    countdown.textContent =
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0");
}


async function copyKey() {

    if (!generatedKey) {
        return;
    }

    try {

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {

            await navigator.clipboard.writeText(
                generatedKey
            );

        } else {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                generatedKey;

            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";

            document.body.appendChild(
                textarea
            );

            textarea.focus();
            textarea.select();

            const copied =
                document.execCommand(
                    "copy"
                );

            textarea.remove();

            if (!copied) {
                throw new Error(
                    "COPY_FAILED"
                );
            }
        }

        copyStatus.textContent =
            "COPIED";

    } catch (error) {

        console.error(
            "COPY ERROR:",
            error
        );

        copyStatus.textContent =
            "COPY FAILED";
    }

    setTimeout(
        () => {
            copyStatus.textContent = "";
        },
        2000
    );
}


copyButton.addEventListener(
    "click",
    copyKey
);


generateKey();

</script>

</body>
</html>
