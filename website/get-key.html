<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGB BOT V1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#08080c;color:#fff}
body{display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:min(430px,100%);text-align:center}
.brand{font-size:25px;font-weight:800;letter-spacing:3px;margin-bottom:4px}
.subtitle{font-size:11px;letter-spacing:4px;color:#888;margin-bottom:28px}
.card{border:1px solid #25252d;border-radius:22px;background:#111116;padding:32px 24px 28px}
.flower{width:52px;height:52px;margin:0 auto 24px;position:relative}
.flower:before,.flower:after{content:"";position:absolute;inset:7px 18px;border:1px solid #555;border-radius:50%}
.flower:after{transform:rotate(90deg)}
.flower span{position:absolute;width:13px;height:13px;border:1px solid #777;border-radius:50%;left:19px;top:19px}
.label{font-size:10px;letter-spacing:3px;color:#777;margin-bottom:10px}
.key{min-height:62px;display:flex;align-items:center;justify-content:center;padding:10px 8px;border:1px solid #2b2b34;border-radius:13px;background:#0b0b10;font-size:22px;font-weight:700;letter-spacing:2px;word-break:break-all}
.status{min-height:18px;margin:14px 0 18px;font-size:11px;color:#888;letter-spacing:1px}
.time-label{font-size:9px;color:#666;letter-spacing:3px;margin-bottom:7px}
.countdown{font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:22px}
.copy{width:100%;height:50px;border:0;border-radius:12px;background:#fff;color:#08080c;font-size:12px;font-weight:800;letter-spacing:2px;cursor:pointer}
.copy:disabled{opacity:.45;cursor:not-allowed}
.copied{height:18px;margin-top:10px;font-size:11px;color:#aaa;letter-spacing:1px}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">RGB BOT V1</div>
<div class="subtitle">ACCESS CODE</div>

<section class="card">
<div class="flower" aria-hidden="true"><span></span></div>

<div class="label">YOUR CODE</div>
<div id="key" class="key">LOADING...</div>
<div id="status" class="status">CONNECTING...</div>

<div class="time-label">TIME REMAINING</div>
<div id="countdown" class="countdown">--:--:--</div>

<button id="copy" class="copy" type="button" disabled>COPY CODE</button>
<div id="copied" class="copied"></div>
</section>
</main>

<script>
(() => {
"use strict";

const keyEl=document.getElementById("key");
const statusEl=document.getElementById("status");
const countdownEl=document.getElementById("countdown");
const copyBtn=document.getElementById("copy");
const copiedEl=document.getElementById("copied");

let generatedKey="";
let expiresAt=0;
let timer=null;

function getVisitorId(){
const storageKey="rgb_bot_visitor_id";

try{
let id=localStorage.getItem(storageKey);

if(id&&id.length<=128){
return id;
}

if(window.crypto&&typeof crypto.randomUUID==="function"){
id=crypto.randomUUID();
}else{
id="rgb-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
}

localStorage.setItem(storageKey,id);
return id;
}catch(_){
return "rgb-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
}
}

async function loadKey(){
try{
const registry=await fetch("current_tunnel.json?ts="+Date.now(),{
cache:"no-store"
});

if(!registry.ok) throw new Error("REGISTRY");

const config=await registry.json();
const baseUrl=String(config.base_url||"").replace(/\/+$/,"");

if(!baseUrl) throw new Error("NO_TUNNEL");

const response=await fetch(baseUrl+"/api/get-key",{
method:"POST",
mode:"cors",
cache:"no-store",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
visitor_id:getVisitorId()
})
});

const data=await response.json();

if(!response.ok||!data.success||!data.key||!data.expires_at){
throw new Error(data.error||"KEY_FAILED");
}

generatedKey=String(data.key);
expiresAt=new Date(data.expires_at).getTime();

if(!Number.isFinite(expiresAt)) throw new Error("EXPIRY");

keyEl.textContent=generatedKey;
statusEl.textContent="CODE READY";
copyBtn.disabled=false;

updateCountdown();
timer=setInterval(updateCountdown,1000);

}catch(error){
console.error("GET KEY ERROR",error);
keyEl.textContent="UNAVAILABLE";
statusEl.textContent="SERVER OFFLINE";
copyBtn.disabled=true;
}
}

function updateCountdown(){
const remaining=expiresAt-Date.now();

if(!Number.isFinite(remaining)||remaining<=0){
countdownEl.textContent="00:00:00";
if(timer){
clearInterval(timer);
timer=null;
}
return;
}

const total=Math.floor(remaining/1000);
const h=Math.floor(total/3600);
const m=Math.floor((total%3600)/60);
const s=total%60;

countdownEl.textContent=
String(h).padStart(2,"0")+":"+
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");
}

copyBtn.addEventListener("click",async()=>{
if(!generatedKey)return;

try{
await navigator.clipboard.writeText(generatedKey);
}catch(_){
const area=document.createElement("textarea");
area.value=generatedKey;
document.body.appendChild(area);
area.select();
document.execCommand("copy");
area.remove();
}

copiedEl.textContent="COPIED";

setTimeout(()=>{
copiedEl.textContent="";
},1800);
});

loadKey();
})();
</script>
</body>
</html>
