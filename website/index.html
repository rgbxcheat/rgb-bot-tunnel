<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

</head>

<body>

<main class="wrap">

    <header class="header">
        <div class="logo">RGB <span>BOT</span> V1</div>
        <div class="sub">ANDROID PERFORMANCE SYSTEM</div>
    </header>

    <section class="hero-card">

        <div class="hero-glow"></div>

        <div class="badge">OFFICIAL WEBSITE</div>

        <h1>RGB BOT V1</h1>

        <p>
            Download the official application and get your
            personal 24-hour access code.
        </p>

        <a class="mainbtn primary" href="RGB_BOT_V1.apk" download>
            DOWNLOAD APK
        </a>

        <a class="mainbtn secondary" href="tasks.html">
            GET KEY
        </a>

        <a class="mainbtn secondary" href="#" onclick="openAdmin();return false;">
            ADMIN PANEL
        </a>

        <div class="divider"></div>

        <div class="info-row">
            <div>
                <strong>24H</strong>
                <span>KEY DURATION</span>

            <div>

                <span>VERSION</span>

                <span>SYSTEM</span>
            </div>
        </div>

    </section>

    <footer>
        RGB BOT V1 • OFFICIAL
    </footer>

</main>

<script>
async function openAdmin(){
    try {
        const response = await fetch(
            "current_tunnel.json?ts=" + Date.now(),
            {cache:"no-store"}
        );
        if (!response.ok) throw new Error("SERVER ADDRESS UNAVAILABLE");

        const config = await response.json();
        const base = String(config.base_url || config.url || "").replace(/\\/+$/, "");

        if (!/^https:\\/\\//i.test(base)) {
            throw new Error("INVALID SERVER ADDRESS");
        }

        window.location.href = base + "/admin/login";
    } catch (error) {
        alert("ADMIN CONNECTION ERROR: " + error.message);
    }
}
</script>
</body>
